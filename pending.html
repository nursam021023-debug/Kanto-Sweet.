<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Orders</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
            color: #2d2d2d;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            margin: 16px 20px 0;
            background: none; border: none;
            color: #5a7fc1; font-size: 14px; font-weight: 600;
            cursor: pointer; padding: 6px 10px; border-radius: 8px;
            transition: background .15s;
        }
        .back-btn:hover { background: #e8eef8; }

        .cancel-btn {
            background: #fff0f0;
            color: #c0392b;
            border: 1px solid #f5c6c6;
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background .15s, transform .1s;
        }
        .cancel-btn:hover { background: #fddede; transform: scale(1.03); }
        .cancel-btn:active { transform: scale(0.97); }

        .page-header { padding: 10px 24px 0; }
        .page-title { font-size: 22px; font-weight: 700; color: #1a1a2e; }
        .page-sub { font-size: 13px; color: #777; margin-top: 2px; }

        .order-list { padding: 14px 20px; display: flex; flex-direction: column; gap: 14px; }

        /* ── Section labels (New → Accepted) ─────────────────────────── */
        .section-label {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; font-weight: 800; letter-spacing: .5px;
            text-transform: uppercase; color: #8a96b0;
            margin: 4px 2px -4px;
        }
        .section-count {
            background: #e4e9f4; color: #5a6a8a;
            border-radius: 99px; padding: 1px 8px; font-size: 11px;
        }

        .empty {
            color: #aaa; text-align: center;
            padding: 60px 0; font-size: 15px;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .empty-icon { font-size: 40px; }

        .order-card {
            background: #fff; border-radius: 14px;
            border: 1px solid #e4e9f4;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
            overflow: hidden;
            animation: fadeUp .25s ease both;
        }
        .order-card.is-new { border-left: 4px solid #f5c242; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .order-card-top {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 16px 8px; border-bottom: 1px solid #f0f2f8;
        }
        .order-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

        .order-type-badge {
            font-size: 11px; font-weight: 700;
            padding: 3px 10px; border-radius: 20px;
        }
        .order-badge   { background: #e8f0fe; color: #3a5fcf; }
        .reserve-badge { background: #fff3e0; color: #b05e00; }

        .status-badge {
            font-size: 11px; font-weight: 700;
            padding: 3px 10px; border-radius: 20px;
            background: #fff3cd; color: #856404;
            animation: pendingPulse 2s ease-in-out infinite;
        }
        @keyframes pendingPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.4); }
            50%       { box-shadow: 0 0 0 6px rgba(255, 193, 7, 0); }
        }

        .order-date { font-size: 11px; color: #aaa; white-space: nowrap; }

        .order-body { display: flex; gap: 12px; padding: 12px 16px 10px; }
        .order-img {
            width: 70px; height: 70px; object-fit: cover;
            border-radius: 10px; border: 1px solid #eee; flex-shrink: 0;
            background: #f4f4f4;
        }
        .order-info { flex: 1; min-width: 0; }
        .order-name { font-size: 15px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
        .order-detail { font-size: 12px; color: #666; margin-top: 2px; }
        .order-price { color: #2a7d4f; }

        /* ── APPROVED BY SELLER ──────────────────────────────────────── */
        .order-card.is-approved { border-left: 4px solid #27ae60; }
        .approved-banner {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #edfaf3 0%, #d4f5e6 100%);
            border-top: 1px solid #a8e6c8;
            animation: approvedPop .4s cubic-bezier(.34,1.56,.64,1) both;
        }
        @keyframes approvedPop {
            from { opacity: 0; transform: scaleY(0.6); }
            to   { opacity: 1; transform: scaleY(1); }
        }
        .approved-icon {
            width: 32px; height: 32px;
            background: #27ae60; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 16px;
        }
        .approved-text strong {
            display: block; font-size: 13px; font-weight: 800;
            color: #0a5940; margin-bottom: 1px;
        }
        .approved-text span { font-size: 11px; color: #2a7d4f; }
        .status-badge.approved { background: #d0f0e8; color: #0a5940; animation: none; }

        .pending-notice {
            margin: 0 16px 12px;
            padding: 10px 14px;
            background: #fffbea;
            border: 1px solid #f5d478;
            border-radius: 10px;
            font-size: 12px;
            color: #7d5a00;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .pending-notice .pn-icon { font-size: 16px; flex-shrink: 0; }
        .pending-notice strong { display: block; font-size: 13px; margin-bottom: 2px; }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(60px);
            background: #1a1a2e; color: #fff; padding: 11px 24px;
            border-radius: 30px; font-size: 13px; font-weight: 600;
            box-shadow: 0 4px 16px rgba(0,0,0,.2);
            transition: transform .3s ease, opacity .3s ease; opacity: 0; z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <button class="back-btn" onclick="goBack()">&#8592; Back</button>

    <div class="page-header">
        <h1 class="page-title">⏳ Pending Orders</h1>
        <p class="page-sub" id="customerLabel">—</p>
    </div>

    <div class="order-list" id="orderList"></div>

    <div class="toast" id="toast"></div>

<script type="module">
    import { getOrdersByCustomer, cancelOrder } from "./db.js";

    const currentCustomer = localStorage.getItem("currentCustomer");
    const currentUID      = localStorage.getItem("currentCustomerUID") || "";
    if (!currentCustomer) {
        alert("Please login as customer first.");
        window.location.href = "login.html";
    }

    document.getElementById("customerLabel").innerText = "Hello, " + currentCustomer + " 👋";

    let _allOrders = [];

    // ── Load orders ────────────────────────────────────────────────────────
    async function loadOrders() {
        try {
            _allOrders = await getOrdersByCustomer(currentUID);
        } catch(e) {
            console.error("Failed to load orders:", e);
        }
        renderOrders();
    }

    function createdSeconds(o) {
        return o.createdAt?.seconds || (o.createdAt ? new Date(o.createdAt).getTime() / 1000 : 0);
    }

    // ── Rejected (order o reservation) ay HINDI na ipinapakita dito.
    //    Nasa cancel/rejected page na lang sila. ───────────────────────────
    function isRejectedOrder(o) {
        return o.status === "rejected" || o.sellerRejectedReservation === true;
    }

    // ── Dalawang grupo, sunod-sunod:
    //    1. NEW  — naghihintay pa ng accept ni seller (status "pending", wala pang sellerApproved)
    //    2. ACCEPTED — na-accept na ni seller (pending/to-ship na may sellerApproved)
    //    Newest muna sa loob ng bawat grupo. ─────────────────────────────────
    function getGroups() {
        const visible = _allOrders.filter(o => !isRejectedOrder(o));
        const byNewest = (a, b) => createdSeconds(b) - createdSeconds(a);

        const newOrders = visible
            .filter(o => o.status === "pending" && !o.sellerApproved)
            .sort(byNewest);
        const accepted = visible
            .filter(o => !!o.sellerApproved && (o.status === "pending" || o.status === "to-ship"))
            .sort(byNewest);

        return { newOrders, accepted };
    }

    // ── Cancel handler ─────────────────────────────────────────────────────
    async function handleCancel(orderId) {
        const confirmed = confirm("Are you sure you want to cancel this order?");
        if (!confirmed) return;
        try {
            await cancelOrder(orderId);
            showToast("Order cancelled successfully.");
            _allOrders = _allOrders.map(o => o.id === orderId ? { ...o, status: "cancelled" } : o);
            renderOrders();
        } catch(e) {
            console.error("Cancel failed:", e);
            alert("Failed to cancel order. Please try again.");
        }
    }

    // ── Render ─────────────────────────────────────────────────────────────
    function renderOrders() {
        const { newOrders, accepted } = getGroups();
        const list = document.getElementById("orderList");
        list.innerHTML = "";

        if (newOrders.length === 0 && accepted.length === 0) {
            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">✅</div>
                    <div>No pending orders!</div>
                </div>`;
            return;
        }

        if (newOrders.length > 0) {
            addSectionLabel(list, "🆕 New Orders", newOrders.length);
            newOrders.forEach(o => list.appendChild(buildCard(o, false)));
        }
        if (accepted.length > 0) {
            addSectionLabel(list, "✅ Accepted", accepted.length);
            accepted.forEach(o => list.appendChild(buildCard(o, true)));
        }
    }

    function addSectionLabel(list, text, count) {
        const el = document.createElement("div");
        el.className = "section-label";
        el.innerHTML = `${text} <span class="section-count">${count}</span>`;
        list.appendChild(el);
    }

    function buildCard(order, isApproved) {
        const card = document.createElement("div");
        const isApprovedPending = isApproved && order.status === "pending";
        const isReservation     = order.type === "reservation";

        card.classList.add("order-card");
        card.classList.add(isApproved ? "is-approved" : "is-new");

        const rawDate = order.createdAt?.seconds
            ? new Date(order.createdAt.seconds * 1000)
            : order.createdAt ? new Date(order.createdAt) : null;
        const displayDate = rawDate
            ? rawDate.toLocaleDateString("en-PH", { year:"numeric", month:"short", day:"numeric" })
            : "—";

        const statusBadge = isApproved
            ? `<span class="status-badge approved">✅ Approved</span>`
            : `<span class="status-badge">🕐 Pending</span>`;

        let approvedBanner = "";
        if (isApproved) {
            const approvedAt = order.sellerApprovedAt
                ? (order.sellerApprovedAt?.seconds
                    ? new Date(order.sellerApprovedAt.seconds * 1000)
                    : new Date(order.sellerApprovedAt))
                : null;
            const approvedTime = approvedAt
                ? approvedAt.toLocaleString("en-PH", { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" })
                : "";
            approvedBanner = `<div class="approved-banner">
                <div class="approved-icon">✅</div>
                <div class="approved-text">
                    <strong>Approved by Seller</strong>
                    <span>Your order has been accepted${approvedTime ? " · " + approvedTime : ""}. ${isApprovedPending ? "The seller is now preparing it." : "It will be prepared for shipping soon!"}</span>
                </div>
            </div>`;
        }

        const noticeAndAction = isApproved
            ? `<div style="padding: 8px 16px 14px; text-align: right; color: #2a7d4f; font-size: 12px; font-weight: 600;">
                🚚 ${isApprovedPending ? "Seller accepted your order and is preparing it." : "Your order is now being prepared for shipping."}
               </div>`
            : `<div class="pending-notice">
                    <div class="pn-icon">⏳</div>
                    <div>
                        <strong>Waiting for seller to accept</strong>
                        Hinihintay pa na i-accept ng seller ang order mo. Kapag na-accept na, makikita mo itong "Approved".
                    </div>
                </div>
                <div style="padding: 0 16px 14px; text-align: right;">
                    <button class="cancel-btn" data-id="${order.id}">✕ Cancel Order</button>
                </div>`;

        card.innerHTML = `
            <div class="order-card-top">
                <div class="order-meta">
                    <span class="order-type-badge ${isReservation ? 'reserve-badge' : 'order-badge'}">
                        ${isReservation ? '📅 Reservation' : '🛒 Order'}
                    </span>
                    ${statusBadge}
                </div>
                <span class="order-date">${displayDate}</span>
            </div>

            <div class="order-body">
                <img class="order-img" src="${order.image || ''}" alt="${order.name || ''}">
                <div class="order-info">
                    <h3 class="order-name">${order.name || 'Item'}</h3>
                    <p class="order-detail">Qty: <strong>${order.qty || 1}</strong></p>
                    <p class="order-detail">Price: <strong class="order-price">₱${(parseFloat(order.price || 0) * (order.qty || 1)).toFixed(0)}</strong></p>
                    ${order.referenceNum ? `<p class="order-detail">Ref #: <strong>${order.referenceNum}</strong></p>` : ''}
                </div>
            </div>

            ${approvedBanner}
            ${noticeAndAction}
        `;

        if (!isApproved) {
            card.querySelector(".cancel-btn").addEventListener("click", () => handleCancel(order.id));
        }
        return card;
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.innerText = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
    }

    window.goBack = function() { window.location.href = "customer-profile.html"; };

    loadOrders();
</script>
</body>
</html>
